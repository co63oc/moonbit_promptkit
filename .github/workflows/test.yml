name: CI-test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install MoonBit
      uses: ./.github/actions/install-moonbit
      with:
        version: "0.1.20260703"

    - name: Run moon test
      run: moon update && moon test --deny-warn
