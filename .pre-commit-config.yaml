repos:
  - repo: local
    hooks:
      - id: moon-info
        name: moon info
        description: Update MoonBit package interface files
        entry: moon info
        language: system
        pass_filenames: false
        always_run: true
      - id: moon-check
        name: moon check
        description: Check MoonBit package compilation
        entry: moon check --deny-warn
        language: system
        pass_filenames: false
        always_run: true
      - id: moon-fmt
        name: moon fmt
        description: Format MoonBit source files
        entry: moon fmt
        language: system
        pass_filenames: false
        always_run: true
